name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install pinned dependencies
        run: |
          pip install -r requirements.lock
          pip install --no-deps -e .
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests (synthetic sample only, no Kaggle)
        run: pytest
      - name: Pipeline smoke run on the sample
        env:
          CLICKSTREAM_DATA: ${{ runner.temp }}/data
          CLICKSTREAM_REPORTS: ${{ runner.temp }}/reports
        run: |
          clickstream run --file data/sample/events_sample.csv
          clickstream compare-engines --engines duckdb,polars,python
